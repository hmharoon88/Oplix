<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Oplix">
    <title>Oplix — Log in</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <nav class="site-nav">
        <div class="site-nav-inner">
            <a href="index.html" class="logo brand-lockup">
                <span class="logo-tagline">Every store, one dashboard</span>
                <span class="logo-mark">Oplix</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="features.html">Features</a>
                <a href="support.html">Support</a>
                <a href="login.html" class="nav-login active">Log in</a>
                <a href="index.html#download" class="btn btn-nav">Get the App</a>
            </div>
        </div>
    </nav>

    <div class="login-page">
        <div class="login-card">
            <h1>Log in</h1>

            <p id="login-error" class="login-error" hidden role="alert"></p>

            <form id="login-form" class="login-form" novalidate>
                <label>
                    Email
                    <input type="email" name="email" autocomplete="username" placeholder="you@company.com" required>
                </label>
                <label>
                    Password
                    <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                </label>
                <button type="submit" id="login-submit" class="btn btn-primary btn-full">Sign in</button>
            </form>

            <p class="login-links">
                <a href="#" id="forgot-password">Forgot password?</a>
                ·
                <a href="support.html">Need help?</a>
            </p>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Oplix. All rights reserved.</p>
    </footer>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-config.override.js" onerror=""></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login-page.js"></script>
</body>
</html>
